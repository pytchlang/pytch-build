[tox]
envlist = py3, flake8, doc

[testenv:flake8]
allowlist_externals = flake8
commands =
    flake8 pytchbuild tests

[testenv:doc]
changedir = doc
allowlist_externals = make
commands =
    make html

[testenv:py3]
changedir = tests
allowlist_externals = pytest
# Fail on any text I/O which relies on the locale's encoding rather
# than specifying "utf-8".
setenv =
    PYTHONWARNDEFAULTENCODING = 1
commands =
    pytest -W error::EncodingWarning --basetemp={envtmpdir}

[flake8]
max-line-length = 92
